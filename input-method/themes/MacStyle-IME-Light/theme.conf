[Metadata]
Name=MacStyle IME Light
Version=1
Author=Linux Desktop Enhancements contributors
Description=Portable light input panel, using native Fcitx colors without external artwork
ScaleWithDPI=True

[InputPanel]
NormalColor=#1c1c1e
HighlightColor=#ffffff
FullWidthHighlight=True
PageButtonAlignment=Last Candidate

[InputPanel/Background]
Color=#f5f5f7
BorderColor=#d1d1d6
BorderWidth=1

[InputPanel/Highlight]
Color=#ed5b00

[InputPanel/TextMargin]
Left=12
Right=12
Top=7
Bottom=7

[Menu/Background]
Color=#f5f5f7
BorderColor=#d1d1d6
BorderWidth=1

[Menu/Highlight]
Color=#ed5b00
