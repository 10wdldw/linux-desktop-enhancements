<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- One browser window: no outer badge, ring, or black frame. -->
    <rect x="4" y="4" width="56" height="56" rx="11" fill="#d5d5d5"/>
    <path d="M4 15h56v-1A10 10 0 0 0 50 4H14A10 10 0 0 0 4 14z" fill="#969696"/>
    <!-- macOS traffic lights on the right: close, minimize, maximize. -->
    <circle cx="40" cy="10" r="2.4" fill="#ff5f57"/>
    <circle cx="47" cy="10" r="2.4" fill="#febc2e"/>
    <circle cx="54" cy="10" r="2.4" fill="#28c840"/>
    <rect x="11" y="20" width="42" height="31" rx="6" fill="#f2f2f2"/>
    <rect x="17" y="25" width="30" height="4" rx="2" fill="#f07832"/>
    <rect x="17" y="34" width="24" height="3" rx="1.5" fill="#969696"/>
    <rect x="17" y="42" width="18" height="3" rx="1.5" fill="#969696"/>
  </g>
</svg>
